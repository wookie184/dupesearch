[project]
name = "dupesearch"
version = "0.2.0a1"
description = "Remove duplicate files quickly with a simple command line tool"
readme = "README.md"
dependencies = ["click==8.*", "rich==13.*"]
authors = [
  {name = "wookie184", email="wookie1840@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Utilities",
]

[project.urls]
repository = "https://github.com/wookie184/dupesearch"

[tool.maturin]
sdist-include = [
    "src/*",
    "Cargo.toml",
    "dupesearch/*.py",
    "dupesearch/*.pyi"
]

[tool.black]
line-length = 100

[build-system]
requires = ["maturin>=0.11"]
build-backend = "maturin"
